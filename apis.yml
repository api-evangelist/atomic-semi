aid: atomic-semi
name: Atomic Semi
description: 'Atomic Semi is a semiconductor company founded in 2023 by Sam Zeloof
  and Jim Keller, now operating publicly as fab2 (atomicsemi.com redirects to fab2.com).
  It designs and manufactures semiconductor fabrication equipment and the fabs that
  house it — pumps, valves, sensors, actuators, chambers, heaters, gas lines and robots
  — with the stated goal of mass-producing small, software-defined chip fabs, a "fab
  fab". It runs a 120K sq ft chip fab in Austin TX (HQ), a 30K sq ft fab fab in Lockhart
  TX, and the original 25K sq ft garage fab in San Francisco. Its one software product,
  Studio (formerly Atomic Studio), is an in-browser collaborative EDA for schematic
  capture, layout and simulation, used internally rather than sold as a developer platform.
  The company publishes no API, SDK, developer portal or machine-readable specification.'
